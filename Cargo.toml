[workspace]
resolver = "2"
members = [
    "crates/embra-init",
    "crates/embrad",
    # The database: a vendored fork of
    # Ward-Software-Defined-Systems/WardSONDB, which continues independently.
    # Its sources change by adopting upstream commits or by a decision to
    # diverge, never in passing, and no lint attribute is added there.
    # No crate of this workspace depends on it: the services reach the
    # database over REST (embra-brain's test
    # `no_crate_depends_on_the_database_library` reads the manifests).
    "crates/wardsondb",
    "crates/embra-apid",
    "crates/embra-trustd",
    "crates/embra-brain",
    "crates/embra-guardian",
    "crates/embra-console",
    "crates/embra-web",
    "crates/embra-common",
    "crates/embra-tool-macro",
    "crates/embra-tools-core",
]

# embra-web-ui is a wasm32 Leptos/Trunk crate with its own toolchain and
# dependency set — deliberately NOT a member of the musl OS workspace.
exclude = [
    "crates/embra-web-ui",
]

[workspace.package]
version = "0.16.0-phase1"
edition = "2024"
license-file = "LICENSE"
repository = "https://github.com/Ward-Software-Defined-Systems/embraOS"

[workspace.dependencies]
# gRPC / Protobuf
tonic = "0.12"
tonic-build = "0.12"
prost = "0.13"
prost-types = "0.13"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# HTTP client (for WardSONDB REST API)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }

# TLS / Crypto
rcgen = "0.13"
rustls = "0.23"
sha2 = "0.10"
# Pure-Rust image decode/encode (png, zune-jpeg, gif, image-webp) — static-musl safe.
# Shared pin: embra-brain normalizes at ingest, embra-console decodes for the in-TUI pane.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
hex = "0.4"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# TUI
# A bump of either is checked on a terminal, not only by compiling: the
# console's screen tests bring the screen up on a PTY that nobody is attached
# to, and the real console is run on one as well. ratatui 0.30 began to ask
# the terminal for its cursor; that compiled, passed every unit test, and left
# the web console's pane empty.
ratatui = "0.30"
crossterm = "0.29"

# Time
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"

# Error handling
anyhow = "1"
thiserror = "1"

# Tool registry (native tool-use migration)
schemars = "0.8"
inventory = "0.3"
once_cell = "1"

# Shared crate
embra-common = { path = "crates/embra-common" }
