[package]
name = "embra-web"
version.workspace = true
edition.workspace = true
license-file.workspace = true
description = "embraOS self-hosted web console (HTTPS :3345) — enterprise shell wrapping the real TUI in xterm.js over a PTY→WebSocket bridge"

[dependencies]
embra-common = { workspace = true }
tokio = { workspace = true }
tonic = { workspace = true }
prost = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rustls = { workspace = true }
axum = { version = "0.8", features = ["ws"] }
tokio-rustls = "0.26"
tokio-stream = "0.1"
futures-util = "0.3"
bytes = "1"
portable-pty = "0.9"
# No `compression`: it pulled zstd and libflate into the tree to deflate `dist/`
# (1.4 MB) for a 0.3 MB smaller binary; the UI is embedded raw (2026-10-26).
rust-embed = "8"
libc = "0.2"

[dev-dependencies]
# tls.rs tests mint a certificate the way embra-trustd does.
rcgen = { workspace = true }
