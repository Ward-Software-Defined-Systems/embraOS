[package]
name = "embra-brain"
version.workspace = true
edition.workspace = true
license-file.workspace = true

[dependencies]
# The boot status embrad publishes (the A/B slots) for system_status.
embra-boot = { path = "../embra-boot" }
embra-common = { workspace = true }
embra-tool-macro = { path = "../embra-tool-macro" }
embra-tools-core = { path = "../embra-tools-core" }
embra-guardian = { path = "../embra-guardian" }
tokio = { workspace = true }
tonic = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
reqwest = { workspace = true }
chrono = { workspace = true }
chrono-tz = { workspace = true }
sha2 = { workspace = true }
image = { workspace = true }
hex = { workspace = true }
schemars = { workspace = true }
inventory = { workspace = true }
once_cell = { workspace = true }
uuid = { version = "1", features = ["v4"] }
tokio-stream = "0.1"
futures = "0.3"
async-trait = "0.1"
libc = "0.2"
base64 = "0.22"
# The PEM parser reqwest reads a certificate bundle with, for the /ca command:
# a source is split as the trust loader splits a file. In the tree already
# through reqwest and rustls: an edge in the lock, no package.
rustls-pki-types = "1"
# A TLS client of the brain's own, for the Guardian's WebSocket broker: the
# roots every reqwest client carries (webpki-roots is the store reqwest
# compiles in) and the operator's, on the provider reqwest uses, `ring`.
# No default features: they name a second crypto backend. Both crates are
# in the tree through reqwest: edges in the lock, no package.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
# The WebSocket client of the Guardian's broker: the handshake and the
# framing, over a TLS stream the brain makes itself (tokio-rustls on the
# roots above), so no TLS feature of the library's own and no connector of
# its own. Both are in the tree (embra-web's axum, reqwest): edges in the
# lock, no package.
tokio-tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }
tokio-rustls = { version = "0.26", default-features = false }
# Local embedding inference (KG-02). tract is pure Rust and static-links under
# musl; ort/rust-bert bind libonnxruntime C++ and cannot. tokenizers MUST stay
# default-features = false: the default `esaxx_fast` pulls esaxx-rs/cpp, and
# `fancy-regex` is the pure-Rust alternative to the `onig` C backend.
tract-onnx = "0.23"
tokenizers = { version = "0.23", default-features = false, features = ["fancy-regex"] }

[dev-dependencies]
wiremock = "0.6"
# Tests of a wait run under tokio's paused clock (`start_paused`), so that
# none of them is bound by the wall clock. A feature of a package the tree
# has (`rt`, `sync` and `time`, all on already): no package and no edge in
# the lock, and no part of a build that is not a test.
tokio = { workspace = true, features = ["test-util"] }
# net.rs proves that a client built there trusts an operator CA drop-in: a
# CA and a leaf minted with rcgen, served by tokio-rustls. All three are in
# the tree already (trustd, embra-web, reqwest): edges in the lock, no package.
rcgen = { workspace = true }
