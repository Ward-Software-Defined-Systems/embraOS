[package]
name = "embra-brain"
version.workspace = true
edition.workspace = true
license-file.workspace = true

[dependencies]
embra-common = { workspace = true }
embra-tool-macro = { path = "../embra-tool-macro" }
embra-tools-core = { path = "../embra-tools-core" }
embra-guardian = { path = "../embra-guardian" }
tokio = { workspace = true }
tonic = { workspace = true }
prost = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
reqwest = { workspace = true }
chrono = { workspace = true }
chrono-tz = { workspace = true }
sha2 = { workspace = true }
image = { workspace = true }
hex = { workspace = true }
schemars = { workspace = true }
inventory = { workspace = true }
once_cell = { workspace = true }
meval = "0.2"
uuid = { version = "1", features = ["v4"] }
tokio-stream = "0.1"
futures = "0.3"
futures-util = "0.3"
async-trait = "0.1"
libc = "0.2"
base64 = "0.22"
# Local embedding inference (KG-02). tract is pure Rust and static-links under
# musl; ort/rust-bert bind libonnxruntime C++ and cannot. tokenizers MUST stay
# default-features = false: the default `esaxx_fast` pulls esaxx-rs/cpp, and
# `fancy-regex` is the pure-Rust alternative to the `onig` C backend.
tract-onnx = "0.23"
tokenizers = { version = "0.23", default-features = false, features = ["fancy-regex"] }

[build-dependencies]
tonic-build = { workspace = true }

[dev-dependencies]
wiremock = "0.6"
