[package]
name = "embra-console"
version.workspace = true
edition.workspace = true
license-file.workspace = true

[dependencies]
embra-common = { workspace = true }
tokio = { workspace = true }
tonic = { workspace = true }
prost = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
ratatui = { workspace = true }
crossterm = { workspace = true }
# Media wave: in-TUI image pane. 8.1.x is the last line on ratatui 0.29;
# defaults OFF — `chafa-dyn` would dlopen libchafa (not on the static
# musl rootfs). Pure-Rust sixel/halfblocks/kitty/iTerm2 encoders only.
ratatui-image = { version = "8.1", default-features = false, features = ["crossterm"] }
image = { workspace = true }
chrono = { workspace = true }
chrono-tz = { workspace = true }
unicode-width = "0.2"
tokio-stream = "0.1"
futures = "0.3"
futures-util = "0.3"
serde = { workspace = true }
serde_json = { workspace = true }
libc = "0.2"

[build-dependencies]
tonic-build = { workspace = true }
