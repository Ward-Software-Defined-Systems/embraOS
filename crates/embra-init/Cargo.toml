[package]
name = "embra-init"
version.workspace = true
edition.workspace = true
license-file.workspace = true

# embra-init is a static binary — minimal dependencies
# No tokio, no async — this runs before the OS is fully up
[dependencies]
# The boot contract: the slot on the kernel line and partitions by GPT name.
embra-boot = { path = "../embra-boot" }
nix = { version = "0.29", features = ["mount", "fs", "process", "signal", "reboot"] }
