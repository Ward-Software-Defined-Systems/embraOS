[package]
name = "embra-trustd"
version.workspace = true
edition.workspace = true
license-file.workspace = true

[dependencies]
embra-common = { workspace = true }
embra-boot = { path = "../embra-boot" }
tokio = { workspace = true }
tonic = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
rcgen = { workspace = true }
sha2 = { workspace = true }
# The CA certificate's PEM is read to its DER (pki.rs::first_certificate).
# Already in the tree through rustls.
rustls-pki-types = "1"
serde_json = { workspace = true }
reqwest = { workspace = true }
time = "0.3"

[dev-dependencies]
wiremock = "0.6"
# pki.rs verifies what it mints the way a client does (#31, #52): the chain
# to the CA, the names, the usages. Already in the tree through reqwest.
rustls = { workspace = true }
